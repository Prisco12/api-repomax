# Simulates the application share of a small VPS (2 vCPU / 4 GB).
# The remaining resources are reserved for the operating system and Docker.
services:
  web:
    cpus: 0.1
    mem_limit: 128m

  api:
    cpus: 0.75
    mem_limit: 768m
    environment:
      # Capacity tests must reach the application instead of being stopped by
      # the per-IP protection. The regular Compose configuration is unchanged.
      RATE_LIMIT_MAX: ${PERF_RATE_LIMIT_MAX:-1000000}

  postgres:
    cpus: 0.6
    mem_limit: 1536m

  redis:
    cpus: 0.1
    mem_limit: 128m

  prometheus:
    cpus: 0.12
    mem_limit: 256m

  grafana:
    cpus: 0.08
    mem_limit: 256m

  loki:
    cpus: 0.08
    mem_limit: 192m

  tempo:
    cpus: 0.08
    mem_limit: 192m

  alloy:
    cpus: 0.09
    mem_limit: 96m
