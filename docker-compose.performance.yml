services:
  web:
    build:
      context: ../frontend-admin-repomax
      dockerfile: Dockerfile.performance
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PERF_HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: 5
