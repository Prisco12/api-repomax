name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --runInBand

  integration:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nest_api?schema=public|' .env
      - run: docker compose up --build -d
      - run: docker compose exec -T api npx prisma migrate deploy
      - run: docker compose exec -T api npm run seed
      - run: docker compose exec -T api npm run test:integration
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v --remove-orphans
